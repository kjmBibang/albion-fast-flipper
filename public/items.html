<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Albion Item Name Map</title>
  <style>
    :root{color-scheme:dark;--bg:#12151b;--panel:#1b2029;--line:#303846;--muted:#a2adbc;--gold:#f2c879;--green:#79d6a1}
    *{box-sizing:border-box}body{font:14px system-ui,sans-serif;margin:0;background:var(--bg);color:#edf1f7}main{max-width:1200px;margin:auto;padding:28px}h1{font-size:25px;margin:0 0 6px}.muted{color:var(--muted)}a{color:#9dc8ff}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px}input{padding:9px 12px;background:#11151b;border:1px solid var(--line);border-radius:6px;color:inherit}input[type=search]{min-width:270px}select{padding:8px;background:#11151b;border:1px solid var(--line);border-radius:6px;color:inherit}.wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel)}table{border-collapse:collapse;width:100%;min-width:760px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{color:#bdc7d5;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:#202631;position:sticky;top:0}tr:last-child td{border:0}.raw{font-family:Consolas,monospace;color:var(--gold)}td input{width:100%;min-width:200px}.empty{padding:20px;color:var(--muted)}.count{font-variant-numeric:tabular-nums;color:var(--green)}
  </style>
</head>
<body><main>
  <h1>Item name map</h1>
  <div class="muted">Raw item IDs from scanned market orders, grouped by recognizable family. Add your own term to build a local reference map; it saves in this browser.</div>
  <p><a href="/">← Back to Albion Fast Flipper</a></p>
  <div class="toolbar"><input id="filter" type="search" placeholder="Filter raw ID or item name"><label>Family <select id="family"><option value="">All families</option></select></label><span id="status" class="muted">Loading scanned item IDs…</span></div>
  <div class="wrap"><table><thead><tr><th>Family</th><th>Raw item ID</th><th>Game item name</th><th>Your term</th></tr></thead><tbody id="rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody></table></div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const familyOf=id=>{const s=id.toUpperCase();if(/(?:^|_)SET1(?:_|$)/.test(s))return 'Set 1';if(/(?:^|_)SET2(?:_|$)/.test(s))return 'Set 2';for(const [word,label] of [['AVALON','Avalonian'],['KEEPER','Keeper'],['MORGANA','Morgana'],['HELL','Demonic'],['UNDERTAKER','Undead'],['HERETIC','Heretic']])if(s.includes(word))return label;if(/(?:^|_)AR(?:_|$)|_ARTIFACT/.test(s))return 'Artifact (other)';return 'Standard / other'};
const labels=JSON.parse(localStorage.getItem('albionItemTerms')||'{}');let items=[];
function render(){const q=document.getElementById('filter').value.toLowerCase(),family=document.getElementById('family').value;const rows=items.filter(x=>(!family||familyOf(x.itemType)===family)&&`${x.itemType} ${x.name||''} ${labels[x.itemType]||''}`.toLowerCase().includes(q));document.getElementById('status').textContent=`${rows.length.toLocaleString()} of ${items.length.toLocaleString()} scanned item IDs`;document.getElementById('rows').innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(familyOf(x.itemType))}</td><td class="raw">${esc(x.itemType)}</td><td>${esc(x.name||'Name unavailable')}</td><td><input data-term="${esc(x.itemType)}" aria-label="Your term for ${esc(x.itemType)}" value="${esc(labels[x.itemType]||'')}" placeholder="Add your term"></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No matching scanned item IDs.</td></tr>'}
document.getElementById('filter').addEventListener('input',render);document.getElementById('family').addEventListener('change',render);document.getElementById('rows').addEventListener('input',e=>{const input=e.target.closest('[data-term]');if(!input)return;const key=input.dataset.term;if(input.value.trim())labels[key]=input.value.trim();else delete labels[key];localStorage.setItem('albionItemTerms',JSON.stringify(labels))});
async function load(){try{items=await(await fetch('/api/item-catalog',{cache:'no-store'})).json();const families=[...new Set(items.map(x=>familyOf(x.itemType)))].sort();document.getElementById('family').innerHTML='<option value="">All families</option>'+families.map(f=>`<option>${esc(f)}</option>`).join('');render();if(!items.length)return;document.getElementById('status').textContent=`${items.length.toLocaleString()} raw item IDs loaded; looking up game names in the background…`;for(let start=0;start<items.length;start+=80){const batch=items.slice(start,start+80);try{const response=await fetch(`/api/item-names?ids=${encodeURIComponent(batch.map(x=>x.itemType).join(','))}`,{cache:'no-store'});const names=await response.json();for(const item of batch)item.name=names[item.itemType]||''}catch{}render()}document.getElementById('status').textContent=`${items.length.toLocaleString()} raw item IDs loaded. Game names are shown when available.`}catch{document.getElementById('status').textContent='Could not load scanned item IDs.';document.getElementById('rows').innerHTML='<tr><td colspan="4" class="empty">The item catalog is unavailable. Make sure the app is running and refresh this page.</td></tr>'}}
load();
</script></body></html>
